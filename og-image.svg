  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1000" cy="150" r="300" fill="#6366f1" opacity="0.12" filter="blur(80px)" />
  <circle cx="200" cy="500" r="260" fill="#a855f7" opacity="0.15" filter="blur(70px)" />

